<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Onix Secure Browser</title>
    <style>
        body {
            padding-top: 50px;
            font-family: Arial, Helvetica, sans-serif;
            background-color: lightgray;
        }

        header {
            position: fixed;
            background-color: gray;
            left: 50%;
            width: 80%;
            opacity: 0.9;
            backdrop-filter: blur(100px);
            transform: translateX(-50%);
            top: 4px;
            border-radius: 20px;
            padding: 5px;
            align-items: center;
            display: flex;
            z-index: 10000;
        }

        button {
            background-color: darkgray;
            transition: all 0.3s ease;
            border-radius: 5px;
            margin-right: 5px;
            padding: 5px;
            color: inherit;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(0.7);
            transition: filter 0.3s ease;
        }

        a {
            background-color: darkgray;
            transition: all 0.3s ease;
            border-radius: 5px;
            padding: 5px;
            color: inherit;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }

        a:hover {
            filter: brightness(0.7);
            transition: filter 0.3s ease;
        }

        .home {
            margin-right: 10px;
        }

        .paragraph {
            text-align: center;
            border-radius: 10px;
            background-color: gray;
            padding: 20px;
        }

        input {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: darkgrey;
            flex: 1;
        }

        iframe {
            width: 100%;
            border: 2px solid #ccc;
            border-radius: 10px;
            background: white;
        }

        #status {
            font-size: 0.9em;
            color: gray;
        }

        .url-bar {
            display: flex;
            gap: 10px;
        }

        .websocket {
            display: flex;
            gap: 10px;
        }
    </style>
    <script>
        function blankify() {
            const website = window.open("about:blank")
            website.document.write(document.documentElement.outerHTML)
            website.document.close()
            window.location.href = "https://launchpad.classlink.com"
        }
    </script>
    <header>
        <img class="home" src="/icon.svg" height="40" onclick="window.location.href='/'">
        <button onclick="window.location.href='https://gixtuh.vercel.app'">official website</button>
    </header>
    <title>onix</title>
    <link rel="icon" href="/icon.svg">
</head>

<body>
    <h1>Onix Secure Browser (legacy)</h1>
    <h4>The new version is at <a href="https://onixsb1.share.zrok.io">https://onixsb1.share.zrok.io</a></h4>

    <!-- Custom URL input -->
    <div class="url-bar">
        <input type="text" id="custom-url" placeholder="Enter custom URL here">
        <button id="go-btn">Go</button>
    </div>

    <div class="websocket">
        <input type="text" id="custom-websocket" placeholder="Enter custom websocket here.">
        <button id="use-btn">Use</button>
        <button id="default-btn">Default</button>
    </div>

    <!-- Preset buttons -->
    <div>
        <button>https://example.com</button>
        <button>https://wikipedia.org</button>
        <button>https://search.brave.com</button>
        <button>https://ifconfig.me</button>
        <button>https://tenor.com</button>
    </div>
    <br />
    <input id="scriptallow" type="checkbox">Allow custom scripts</input>
    <br />
    <button onclick="iframe.requestFullscreen()">Fullscreen</button>


    <p id="status">Connecting...</p>
    <iframe id="viewer" height=640 sandbox="allow-forms allow-same-origin allow-modals"></iframe>

    <script>
        let customwstext = "wss://osb-legacy.onrender.com";
        let ws = new WebSocket(customwstext);
        const status = document.getElementById('status');
        let iframe = document.getElementById('viewer');
        let currenturl;

        function refreshIframe(url, sandboxModes) {
            const parent = iframe.parentNode;

            const newIframe = document.createElement('iframe');
            newIframe.id = 'viewer';
            newIframe.height = '640';
            newIframe.width = '100%';
            newIframe.sandbox = sandboxModes; // e.g. "allow-scripts allow-forms allow-same-origin"
            newIframe.srcdoc = url;

            parent.replaceChild(newIframe, iframe);
            iframe = newIframe
        }

        let enabled

        document.getElementById("scriptallow").addEventListener("change", (e) => {
            if (e.target.checked) {
                enabled = confirm("Enabling scripts could make Onix Secure Browser insecure. Are you sure you want to enable scripts?")
            } else {
                enabled = true
            }
            if (enabled) {
                const sandbox = e.target.checked
                    ? "allow-scripts allow-forms allow-same-origin allow-modals"
                    : "allow-forms allow-same-origin allow-modals";
                ws.send(currenturl)
                refreshIframe("Refreshing page", sandbox);
            }
        });

        setInterval(() => {
            try {
                const loc = iframe.contentWindow.location;
                if (loc.protocol === "file:") {
                    console.warn("Detected file:// protocol — switching back to HTTPS!");
                    const safeUrl = "https://" + loc.hostname + loc.pathname + loc.search + loc.hash;
                    ws.send(safeUrl)
                }
            } catch (err) {
                const loc = new URL(currenturl)
                console.warn("Detected file:// protocol — switching back to HTTPS!");
                const safeUrl = "https://" + loc.hostname + loc.pathname + loc.search + loc.hash;
                ws.send(safeUrl)
            }
        }, 500);

        // 🔁 Function to bind listeners to a given socket
        function bindSocket(socket) {
            socket.addEventListener("open", () => {
                setTimeout(() => {
                    status.textContent = `Client connected to websocket ${socket.url}`;
                }, 500)
            });

            socket.addEventListener("close", () => {
                status.textContent = "Client disconnected from websocket.";
            });

            socket.addEventListener("error", (err) => {
                console.error(err);
                status.textContent = "Error loading the proxy websocket.";
            });

            socket.addEventListener("message", (event) => {
                iframe.srcdoc = event.data;
                iframe.onload = () => {
                    try {
                        const win = iframe.contentWindow;
                        const doc = win.document;

                        function sendSmartURL(url) {
                            let resolved;
                            try {
                                // absolute URL
                                resolved = new URL(url).href;
                            } catch {
                                // relative URL -> resolve against the current iframe location
                                const base = currenturl || "https://gixtuh.vercel.app/";
                                resolved = new URL(url, base).href;
                            }
                            currenturl = resolved;
                            ws.send(resolved);
                        }

                        // hijack links
                        doc.querySelectorAll("a[href]").forEach(a => {
                            a.onclick = e => {
                                e.preventDefault();
                                sendSmartURL(a.getAttribute("href"));
                            };
                        });

                        // hijack forms
                        doc.querySelectorAll("form").forEach(f => {
                            f.onsubmit = e => {
                                e.preventDefault();
                                const action = f.action || win.location.href;
                                const params = new URLSearchParams(new FormData(f)).toString();
                                sendSmartURL(action + (action.includes("?") ? "&" : "?") + params);
                            };
                        });

                        // JS redirects
                        ["assign", "replace"].forEach(method => {
                            const orig = win.location[method].bind(win.location);
                            win.location[method] = url => { sendSmartURL(url); return orig(url); };
                        });

                    } catch (e) {
                        console.warn("iframe sandbox blocked access", e);
                    }
                };

            });
        }

        // connect the default socket
        bindSocket(ws);

        // handle preset buttons
        document.querySelectorAll('button').forEach(el => {
            const url = el.textContent.trim();
            if (!url.startsWith('http')) return; // skip the non-URL buttons
            el.addEventListener('click', () => {
                currenturl = url;
                status.textContent = `loading URL ${url}...`;
                ws.send(url);
            });
        });

        // custom URL input
        const input = document.getElementById('custom-url');
        document.getElementById('go-btn').addEventListener('click', () => {
            const url = input.value.trim();
            if (!url) return;
            currenturl = url;
            status.textContent = `loading URL ${url}...`;
            ws.send(url);
        });

        const customws = document.getElementById('custom-websocket');
        document.getElementById('use-btn').addEventListener('click', () => {
            const newWSText = customws.value.trim();
            if (!newWSText) return;

            status.textContent = `Websocket switched to ${newWSText}`;

            try { ws.close(); } catch { }

            ws = new WebSocket(newWSText);
            bindSocket(ws);
        });
        document.getElementById('default-btn').addEventListener('click', () => {
            const newWSText = "wss://osb-legacy.onrender.com/";
            if (!newWSText) return;

            status.textContent = `Websocket switched to ${newWSText} (default)`;

            try { ws.close(); } catch { }

            ws = new WebSocket(newWSText);
            bindSocket(ws);
        });

        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('go-btn').click(); });
        customws.addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('use-btn').click(); });
    </script>

</body>


</html>
